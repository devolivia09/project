<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <!-- Google Icons for Arrow icon-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrows_more_down"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="axis-line">
        <div class="axis-point"></div>
      </div>
      <div class="section-wrapper">
        <section class="section intro">
          <div class="intro__txt-dot">
            <div class="intro__dot-inner-line"></div>
          </div>
          <div class="intro__txt">C<span>O</span>NNECT</div>
          <span class="material-symbols-outlined"> arrows_more_down </span>
        </section>
        <section class="section profile">
          <div class="profile-frame">
            <div class="profile__message">message</div>
            <div class="profile__picture">picture</div>
            <div class="profile__name">name</div>
            <div class="profile__info">info</div>
          </div>
        </section>
        <section class="section skills"></section>
        <section class="section works"></section>
        <section class="section outro"></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
