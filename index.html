<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olly.Connect(2026)</title>

    <!-- Favicon 자동호출 방지 -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />

    <!-- Google Fonts :: Noto Serif KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap"
      rel="stylesheet"
    />

    <!-- Google Icons for Arrow icon-->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="axis-line">
        <div class="axis-point"></div>
      </div>
      <div class="section-wrapper">
        <section class="section intro">
          <div class="intro__txt-dot">
            <div class="intro__dot-inner-line"></div>
          </div>
          <div class="intro__txt">C<span>O</span>NNECT</div>
          <img
            src="img/arrow-down.svg"
            class="intro__arrow"
            alt="인트로 더보기 화살표"
          />
        </section>
        <section class="section profile">
          <!-- <div class="section-indicator">Profile</div> -->
          <div class="profile-frame">
            <div class="profile__item profile__message">
              <p>
                사람과 기술을<br />
                사람과 사람을<br />
                연결합니다.
              </p>
            </div>
            <div class="profile__item profile__picture">picture</div>
            <div class="profile__item profile__name">name</div>
            <div class="profile__item profile__info">info</div>
          </div>
        </section>
        <section class="section skills"></section>
        <section class="section works"></section>
        <section class="section outro"></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
